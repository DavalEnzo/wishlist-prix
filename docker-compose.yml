# Wishlist gaming — docker compose up -d --build
# Services: db (PostgreSQL), migrate (one-off), web (the site), worker (prices and alerts).

x-app: &app
  # Raspberry Pi: the arm64 image built by GitHub Actions (docker compose pull).
  # PC or other machine: docker compose up -d --build builds it locally instead.
  image: ${IMAGE:-ghcr.io/davalenzo/wishlist-prix:latest}
  env_file: .env
  environment:
    DATABASE_URL: postgres://wishlist:${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}@db:5432/wishlist
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: wishlist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    build: .
    command: ["node", "src/scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      # Reachable from your network on port 3000. With a Cloudflare tunnel on
      # the same machine, use "127.0.0.1:3000:3000" instead.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "src/worker/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
