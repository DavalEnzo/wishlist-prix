<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist Gaming</title>
<meta name="description" content="Prix le plus bas de ma wishlist de jeux sur PC, PS5 et chez les revendeurs de clés.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  /* Layout: bandeau de comparaison, carte "à acheter maintenant" + chiffres, puis liste des jeux avec leur meilleur prix. */
  --bg: #ECEEF6;
  --surface: #F8F9FD;
  --surface-2: #E2E5F1;
  --field: #FFFFFF;
  --ink: #15172E;
  --ink-2: #4F5478;
  --line: #CBD0E4;
  --primary: #2B2FA0;
  --primary-soft: #DCDFFA;
  --pc: #965E00;
  --ps5: #2C66E8;
  --good: #16804D;
  --warn: #8F5A00;
  --danger: #C2342F;
  --tile-s: 48%;
  --tile-l: 84%;
  --tile-ink: 24%;
  --font-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1022;
    --surface: #161931;
    --surface-2: #1F2342;
    --field: #0F1226;
    --ink: #E8EAFB;
    --ink-2: #9BA1C8;
    --line: #2A2F54;
    --primary: #A7AEFF;
    --primary-soft: #262B5E;
    --pc: #E5AA3C;
    --ps5: #79A3FF;
    --good: #4FD69B;
    --warn: #E8B04A;
    --danger: #FF7F78;
    --tile-s: 34%;
    --tile-l: 26%;
    --tile-ink: 86%;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(56px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 clamp(2rem, 6vw, 2.75rem)/0.95 var(--font-display); letter-spacing: -0.015em; }
.sub { margin: 8px 0 0; font: 500 0.72rem/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.toplinks { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 0.88rem; color: var(--ink-2); text-align: right; }
.toplinks a { font-weight: 600; text-decoration: none; }
.toplinks a:hover { text-decoration: underline; }

.banner { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--primary-soft); font-size: 0.92rem; }
.banner.err { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); }
.banner code { font: 500 0.82rem var(--font-mono); }

.comparebar { display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.segbtn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 999px; font: 600 0.88rem var(--font-body); cursor: pointer; }
.segbtn b { font: 500 0.74rem var(--font-mono); color: var(--ink-2); }
.segbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.segbtn[aria-pressed="true"] b { color: inherit; opacity: 0.7; }
.keytoggle { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.keytoggle input { width: 18px; height: 18px; accent-color: var(--primary); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot-pc { background: var(--pc); }
.dot-ps5 { background: var(--ps5); }

.overview { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.eyebrow { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font: 500 0.7rem/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.headline { margin: 0; font: 700 clamp(1.3rem, 4.5vw, 1.7rem)/1.15 var(--font-display); text-wrap: balance; }
.lead { margin: 8px 0 0; color: var(--ink-2); font-size: 0.92rem; }
.dealist { list-style: none; margin: 4px 0 0; padding: 0; }
.dealrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.dealrow:first-child { border-top: 0; }
.dealmain { min-width: 0; }
.dealmain b { display: block; font: 600 1rem/1.25 var(--font-display); overflow-wrap: anywhere; }
.dealsub { display: flex; gap: 8px; align-items: center; margin-top: 4px; font: 500 0.72rem/1.2 var(--font-mono); color: var(--ink-2); flex-wrap: wrap; }
.dealprice { font: 700 1.25rem var(--font-display); font-variant-numeric: tabular-nums; color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; margin: 0; }
.stat { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.stat dt { font: 500 0.68rem/1.2 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.stat dd { margin: 3px 0 0; font: 700 1.65rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat dd.small { font-size: 1.1rem; line-height: 1.3; }
.stat small { display: block; margin-top: 2px; font: 500 0.7rem var(--font-mono); color: var(--ink-2); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 0 12px; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.toolbar .sortsel { flex: 0 1 230px; min-width: 170px; }
.toolbar input, .toolbar select { width: 100%; min-height: 42px; padding: 10px 12px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 250px auto; grid-template-areas: "tile main price act"; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.row.open { grid-template-areas: "tile main price act" "detail detail detail detail"; }
.row:first-child { border-top: 0; }
.row.hit { background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.tile { grid-area: tile; width: 100%; aspect-ratio: 1; border-radius: 11px; display: grid; place-items: center; background: hsl(var(--h) var(--tile-s) var(--tile-l)); color: hsl(var(--h) 45% var(--tile-ink)); font: 700 1rem var(--font-display); user-select: none; }
.main { grid-area: main; min-width: 0; }
.rowtitle { margin: 0; font: 600 1rem/1.25 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; gap: 6px 12px; align-items: center; margin-top: 5px; font: 500 0.72rem/1.3 var(--font-mono); color: var(--ink-2); flex-wrap: wrap; }
.plat { display: inline-flex; gap: 6px; align-items: center; text-transform: uppercase; letter-spacing: 0.06em; }
.flag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; font: 600 0.7rem var(--font-body); }
.flag.warn { color: var(--warn); }
.flag.err { color: var(--danger); }
.prio { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.prio i { width: 3px; border-radius: 1px; background: var(--line); }
.prio i:nth-child(1) { height: 5px; }
.prio i:nth-child(2) { height: 8px; }
.prio i:nth-child(3) { height: 11px; }
.prio i.on { background: var(--ink-2); }
.price { grid-area: price; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.price small { font: 500 0.72rem/1.35 var(--font-mono); color: var(--ink-2); }
.bestprice { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.bestprice b { font: 700 1.25rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.bestwhere { font: 500 0.72rem var(--font-mono); color: var(--ink-2); }
.badge { display: inline-block; align-self: flex-start; margin-top: 2px; padding: 2px 9px; border-radius: 999px; font: 600 0.74rem var(--font-body); color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); }
.act { grid-area: act; display: flex; justify-content: flex-end; }
.morebtn { font: 600 0.75rem var(--font-mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; min-height: 34px; cursor: pointer; white-space: nowrap; }
.morebtn:hover { background: var(--surface-2); }

.detail { grid-area: detail; display: grid; gap: 16px; padding-top: 12px; border-top: 1px dashed var(--line); min-width: 0; }
.pblock { min-width: 0; }
.phead { display: flex; gap: 6px 12px; align-items: baseline; flex-wrap: wrap; margin: 0 0 6px; font: 600 0.92rem var(--font-body); }
.phead .found { font: 500 0.75rem var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.phead a { font-size: 0.85rem; margin-left: auto; text-decoration: none; }
.phead a:hover { text-decoration: underline; }
.note { margin: 0 0 6px; font-size: 0.88rem; color: var(--ink-2); }
.note.warn { color: var(--warn); }
.note.err { color: var(--danger); }
.offerlist { list-style: none; margin: 0; padding: 0; }
.offer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.offer:last-child { border-bottom: 0; }
.offer.best .oprice { color: var(--good); }
.ostore { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.ometa { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; margin-top: 3px; font: 500 0.72rem/1.3 var(--font-mono); color: var(--ink-2); }
.kind { font-style: normal; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.coupon { color: var(--good); }
.oprice { text-align: right; font: 700 1.05rem var(--font-display); font-variant-numeric: tabular-nums; }
.oprice s { display: block; font: 500 0.72rem var(--font-mono); color: var(--ink-2); }
.foot { margin: 8px 0 0; font: 500 0.72rem/1.5 var(--font-mono); color: var(--ink-2); }

@media (max-width: 700px) {
  .row { grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "tile main act" "tile price price"; gap: 8px 12px; padding: 12px; }
  .row.open { grid-template-areas: "tile main act" "tile price price" "detail detail detail"; }
  .toplinks { align-items: flex-start; text-align: left; }
}

.empty { padding: 36px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.empty h2 { margin: 0 0 6px; font: 700 1.2rem var(--font-display); }
.empty p { margin: 0 auto 10px; max-width: 52ch; color: var(--ink-2); }
.empty p:last-child { margin-bottom: 0; }
.pagefoot { font-size: 0.82rem; color: var(--ink-2); max-width: 75ch; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Wishlist gaming</h1>
      <p class="sub">PC · PS5 · ROG Ally</p>
    </div>
    <div class="toplinks">
      <span id="updated">Chargement…</span>
      <a id="edit" href="#" hidden target="_blank" rel="noopener noreferrer">Modifier la wishlist</a>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="comparebar">
    <nav id="scope" class="seg" aria-label="Comparer les prix sur"></nav>
    <label class="keytoggle" for="keys"><input id="keys" type="checkbox" checked> Inclure les revendeurs de clés</label>
  </div>

  <section class="overview">
    <article id="deals" class="panel" aria-live="polite"></article>
    <aside id="stats" class="panel"></aside>
  </section>

  <section>
    <div class="toolbar">
      <div class="search">
        <label class="sr" for="q">Rechercher un titre</label>
        <input id="q" type="search" placeholder="Rechercher un titre" autocomplete="off">
      </div>
      <div class="sortsel">
        <label class="sr" for="sort">Trier par</label>
        <select id="sort">
          <option value="deal">Tri : meilleure affaire</option>
          <option value="price">Tri : prix le plus bas</option>
          <option value="priority">Tri : niveau d’envie</option>
          <option value="title">Tri : titre A–Z</option>
        </select>
      </div>
    </div>
    <ul id="list" class="list" hidden></ul>
    <div id="empty" class="empty" hidden></div>
  </section>

  <p class="pagefoot">Prix relevés chaque matin sur AllKeyShop (GoClecD). Le prix affiché inclut le code promo indiqué. Les clés de revendeurs peuvent être limitées à une région ou à une plateforme d’activation : vérifie l’offre avant d’acheter.</p>
</div>

<script>
(function () {
  'use strict';
  const PLATS = { pc: 'PC', ps5: 'PS5' };
  const SCOPES = [['all', 'Toutes'], ['pc', 'PC · ROG Ally'], ['ps5', 'PS5']];
  const PRIO = { 1: 'faible', 2: 'moyenne', 3: 'forte' };
  const STALE_MS = 2 * 86400000;
  const S = { data: null, failed: false, scope: 'all', keys: true, q: '', sort: 'deal', open: new Set() };

  const $ = (id) => document.getElementById(id);
  const eurf = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
  const eur = (n) => eurf.format(n);
  const when = (iso) => new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dayOf = (s) => { const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('T') ? '' : 'Z')); return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const fold = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const safeUrl = (u) => (typeof u === 'string' && /^https:\/\//i.test(u) ? u : null);
  const usable = (r) => !r.error && (r.match === 'exact' || r.match === 'close');
  const byTitle = (a, b) => a.title.localeCompare(b.title, 'fr');

  try {
    const p = JSON.parse(localStorage.getItem('wl-prix-ui') || '{}');
    if (p.scope === 'all' || PLATS[p.scope]) S.scope = p.scope;
    if (['deal', 'price', 'priority', 'title'].includes(p.sort)) S.sort = p.sort;
    if (p.keys === false) S.keys = false;
  } catch (e) { /* storage unavailable */ }
  const savePrefs = () => { try { localStorage.setItem('wl-prix-ui', JSON.stringify({ scope: S.scope, sort: S.sort, keys: S.keys })); } catch (e) { /* ignore */ } };

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') n.style.cssText = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  }
  const hue = (t) => { let h = 0; for (const c of t.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
  const initials = (t) => { const w = t.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean); return !w.length ? '?' : w.length === 1 ? w[0].slice(0, 2).toUpperCase() : (w[0][0] + w[1][0]).toUpperCase(); };
  const platTag = (p) => el('span', { class: 'plat' }, el('i', { class: 'dot dot-' + p }), PLATS[p]);
  const prioGlyph = (n) => el('span', { class: 'prio', role: 'img', 'aria-label': 'Envie ' + PRIO[n] }, [1, 2, 3].map((i) => el('i', { class: n >= i ? 'on' : '' })));

  /* ---------- derived ---------- */
  const games = () => (S.data && Array.isArray(S.data.games) ? S.data.games : []);
  const inScope = (p) => S.scope === 'all' || p === S.scope;
  const keep = (o) => S.keys || o.kind !== 'revendeur';
  function offersOf(g) {
    return (g.results || []).filter((r) => usable(r) && inScope(r.platform))
      .flatMap((r) => r.offers.filter(keep)).sort((a, b) => a.price - b.price);
  }
  const bestOf = (g) => offersOf(g)[0] || null;
  const under = (g) => { const b = bestOf(g); return !!(b && g.targetPrice && b.price <= g.targetPrice); };
  const needsCheck = (g) => (g.results || []).some((r) => r.match === 'doubtful' || (r.match === 'none' && !r.error));
  function rankDeal(g) { const b = bestOf(g); return !b ? 3 : g.targetPrice ? (b.price <= g.targetPrice ? 0 : 1) : 2; }
  function cmpDeal(a, b) {
    const ra = rankDeal(a), rb = rankDeal(b);
    if (ra !== rb) return ra - rb;
    const ba = bestOf(a), bb = bestOf(b);
    if (ra === 0) return ba.price / a.targetPrice - bb.price / b.targetPrice || byTitle(a, b);
    if (ra === 1) return (ba.price - a.targetPrice) - (bb.price - b.targetPrice) || byTitle(a, b);
    if (ra === 2) return b.priority - a.priority || ba.price - bb.price || byTitle(a, b);
    return b.priority - a.priority || byTitle(a, b);
  }
  function sorter() {
    const p = (g) => { const b = bestOf(g); return b ? b.price : 1e9; };
    if (S.sort === 'price') return (a, b) => p(a) - p(b) || byTitle(a, b);
    if (S.sort === 'priority') return (a, b) => b.priority - a.priority || cmpDeal(a, b);
    if (S.sort === 'title') return byTitle;
    return cmpDeal;
  }

  /* ---------- render ---------- */
  function renderHeader() {
    const d = S.data;
    $('updated').textContent = S.failed ? 'Données indisponibles' : d && d.generatedAt ? 'Dernier relevé le ' + when(d.generatedAt) : 'Pas encore de relevé';
    const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (m && repo) {
      $('edit').href = 'https://github.com/' + m[1] + '/' + repo + '/edit/main/wishlist.json';
      $('edit').hidden = false;
    }
  }

  function renderBanner() {
    const b = $('banner');
    b.replaceChildren();
    b.className = 'banner';
    b.hidden = true;
    if (S.failed) {
      b.classList.add('err');
      b.append(el('span', {}, 'Impossible de lire ', el('code', { text: 'data/prices.json' }), '. Ouvre la page depuis GitHub Pages ou avec ', el('code', { text: 'npm run preview' }), '.'));
      b.hidden = false;
      return;
    }
    const errs = games().filter((g) => g.error).length;
    if (errs) {
      b.classList.add('err');
      b.append(el('span', { text: errs + (errs > 1 ? ' jeux n’ont pas pu être relevés' : ' jeu n’a pas pu être relevé') + ' ce matin. Leurs derniers prix connus restent affichés.' }));
      b.hidden = false;
      return;
    }
    const check = games().filter(needsCheck).length;
    if (check) {
      b.append(el('span', {}, check + (check > 1 ? ' jeux ont' : ' jeu a') + ' un nom à vérifier : ouvre ses offres, puis ajoute ', el('code', { text: '"search"' }), ' dans wishlist.json.'));
      b.hidden = false;
    }
  }

  function renderScope() {
    const box = $('scope');
    box.replaceChildren();
    for (const [id, label] of SCOPES) {
      const n = games().filter((g) => (g.results || []).some((r) => usable(r) && (id === 'all' || r.platform === id) && r.offers.some(keep))).length;
      box.append(el('button', { type: 'button', class: 'segbtn', 'aria-pressed': String(S.scope === id), onclick: () => { S.scope = id; savePrefs(); renderAll(); } },
        id !== 'all' && el('i', { class: 'dot dot-' + id }), el('span', { text: label }), el('b', { text: String(n) })));
    }
  }

  function storeLink(g, o) {
    const r = (g.results || []).find((x) => x.platform === o.platform);
    const u = r && safeUrl(r.url);
    return u ? el('a', { href: u, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Voir les offres de ' + g.title + ' sur GoClecD', text: 'Voir' }) : el('span');
  }

  function renderDeals() {
    const box = $('deals');
    box.replaceChildren();
    const hits = games().filter(under).sort(cmpDeal);
    if (hits.length) {
      box.append(el('p', { class: 'eyebrow' }, el('i', { class: 'live' }), 'À acheter maintenant'));
      box.append(el('ul', { class: 'dealist' }, hits.slice(0, 4).map((g) => {
        const b = bestOf(g);
        return el('li', { class: 'dealrow' },
          el('div', { class: 'dealmain' }, el('b', { text: g.title }), el('span', { class: 'dealsub' }, platTag(b.platform), b.store + (b.kind === 'revendeur' ? ' · clé' : '') + (b.coupon ? ' · code ' + b.coupon : ''))),
          el('span', { class: 'dealprice', text: eur(b.price) }), storeLink(g, b));
      })));
      if (hits.length > 4) box.append(el('p', { class: 'foot', text: '+ ' + (hits.length - 4) + ' autres sous leur prix cible' }));
      return;
    }
    box.append(el('p', { class: 'eyebrow', text: 'À acheter maintenant' }));
    const close = games().map((g) => ({ g, b: bestOf(g) })).filter((x) => x.b && x.g.targetPrice)
      .sort((x, y) => (x.b.price - x.g.targetPrice) - (y.b.price - y.g.targetPrice))[0];
    let lead = 'Ajoute des jeux et un prix cible dans wishlist.json.';
    if (S.failed) lead = 'Les prix ne sont pas disponibles.';
    else if (close) lead = 'Le plus proche : ' + close.g.title + ' à ' + eur(close.b.price) + ' (cible ' + eur(close.g.targetPrice) + ').';
    else if (games().some(bestOf)) lead = 'Ajoute un prix cible à tes jeux pour les voir remonter ici.';
    box.append(el('h2', { class: 'headline', text: 'Rien sous ton prix cible' }), el('p', { class: 'lead', text: lead }));
  }

  function renderStats() {
    const box = $('stats');
    box.replaceChildren();
    const gs = games();
    const priced = gs.map(bestOf).filter(Boolean);
    const total = priced.reduce((a, b) => a + b.price, 0);
    const stat = (label, value, note, small) => el('div', { class: 'stat' }, el('dt', { text: label }), el('dd', { class: small ? 'small' : '', text: String(value) }), note && el('small', { text: note }));
    box.append(el('p', { class: 'eyebrow', text: 'En chiffres' + (S.scope === 'all' ? '' : ' · ' + PLATS[S.scope]) }),
      el('dl', { class: 'stats' },
        stat('Jeux suivis', gs.length),
        stat('Sous le prix cible', gs.filter(under).length),
        stat('Au meilleur prix', eur(total), gs.length - priced.length ? (gs.length - priced.length) + ' sans prix' : 'pour tout acheter'),
        stat('Prochain relevé', 'Demain matin', null, true)));
  }

  function priceBlock(g) {
    const box = el('div', { class: 'price' });
    const offers = offersOf(g);
    if (!offers.length) {
      box.append(el('small', { text: !(g.results || []).some(usable) ? 'Aucun prix fiable' : S.scope === 'all' ? 'Aucune offre avec ces réglages' : 'Aucune offre ' + PLATS[S.scope] }));
      return box;
    }
    const best = offers[0];
    box.append(el('div', { class: 'bestprice' }, el('b', { text: eur(best.price) }),
      el('span', { class: 'bestwhere', text: best.store + ' · ' + PLATS[best.platform] + (best.kind === 'revendeur' ? ' · clé' : '') })));
    const official = offers.find((o) => o.kind === 'officiel' && o.platform === best.platform);
    if (official && best.price < official.price * 0.98) box.append(el('small', { text: '−' + Math.round((1 - best.price / official.price) * 100) + ' % vs ' + official.store + ' (' + eur(official.price) + ')' }));
    if (g.targetPrice) {
      box.append(best.price <= g.targetPrice
        ? el('span', { class: 'badge', text: 'Sous ton prix cible (' + eur(g.targetPrice) + ')' })
        : el('small', { text: 'Cible ' + eur(g.targetPrice) + ' · encore ' + eur(best.price - g.targetPrice) + ' de trop' }));
    }
    return box;
  }

  function platformBlock(g, r) {
    const block = el('div', { class: 'pblock' });
    const u = safeUrl(r.url);
    block.append(el('p', { class: 'phead' }, platTag(r.platform),
      el('span', { class: 'found', text: r.matchedName ? 'Trouvé : ' + r.matchedName : 'Recherche : ' + r.query }),
      u && el('a', { href: u, target: '_blank', rel: 'noopener noreferrer', text: 'Voir sur GoClecD' })));
    if (r.error) block.append(el('p', { class: 'note err', text: 'Relevé impossible : ' + r.error }));
    else if (r.match === 'doubtful' && r.alternatives && r.alternatives.length) block.append(el('p', { class: 'note warn', text: 'Plusieurs jeux correspondent : ' + [r.matchedName].concat(r.alternatives).join(' · ') + '. Indique le bon nom dans "search" pour ce jeu dans wishlist.json.' }));
    else if (r.match === 'doubtful') block.append(el('p', { class: 'note warn', text: 'Ce résultat ne semble pas être le bon jeu. Indique le nom exact du catalogue dans "search" pour ce jeu dans wishlist.json.' }));
    else if (r.match === 'none') block.append(el('p', { class: 'note warn', text: 'Aucun jeu trouvé dans le catalogue pour « ' + r.query + ' ». Essaie un autre nom dans "search".' }));
    if (!usable(r)) return block;
    const offers = r.offers.filter(keep);
    if (r.editionFallback) block.append(el('p', { class: 'note', text: 'Pas d’édition standard trouvée : toutes les éditions sont affichées.' }));
    if (!offers.length) block.append(el('p', { class: 'note', text: r.offers.length ? 'Seuls des revendeurs de clés ont ce jeu. Coche « Inclure les revendeurs de clés » pour les voir.' : 'Aucune offre récente.' }));
    else block.append(el('ul', { class: 'offerlist' }, offers.map((o, i) => el('li', { class: 'offer' + (i === 0 ? ' best' : '') },
      el('div', { class: 'ostore' }, el('span', { text: o.store }),
        el('div', { class: 'ometa' }, el('em', { class: 'kind', text: o.kind === 'revendeur' ? 'clé revendeur' : 'officiel' }), el('span', { text: o.edition }), el('span', { text: o.region }), o.coupon && el('span', { class: 'coupon', text: 'code ' + o.coupon }))),
      el('div', { class: 'oprice' }, eur(o.price), o.listPrice && el('s', { text: eur(o.listPrice) }))))));
    const foot = [];
    if (r.excludedByRegion) foot.push(r.excludedByRegion + (r.excludedByRegion > 1 ? ' offres ignorées' : ' offre ignorée') + ' (région exclue)');
    const h = r.historicalLow;
    if (h && h.official) foot.push('Plus bas historique officiel : ' + eur(h.official.price) + ' chez ' + h.official.merchant + (dayOf(h.official.lastUpdate) ? ' (' + dayOf(h.official.lastUpdate) + ')' : ''));
    if (h && h.keyshops && S.keys) foot.push('Plus bas historique revendeurs : ' + eur(h.keyshops.price) + ' chez ' + h.keyshops.merchant);
    if (foot.length) block.append(el('p', { class: 'foot', text: foot.join(' · ') }));
    return block;
  }

  function row(g) {
    const isOpen = S.open.has(g.id);
    const li = el('li', { class: 'row' + (isOpen ? ' open' : '') + (under(g) ? ' hit' : '') });
    const meta = el('div', { class: 'meta' }, prioGlyph(g.priority), (g.platforms || []).map(platTag));
    if (g.error) meta.append(el('span', { class: 'flag err', text: 'Relevé en échec' }));
    if (needsCheck(g)) meta.append(el('span', { class: 'flag warn', text: 'Nom à vérifier' }));
    if (g.checkedAt && Date.now() - new Date(g.checkedAt).getTime() > STALE_MS) meta.append(el('span', { class: 'flag warn', text: 'Prix du ' + new Date(g.checkedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) }));
    const count = offersOf(g).length;
    li.append(
      el('div', { class: 'tile', 'aria-hidden': 'true', style: '--h:' + hue(g.title) }, initials(g.title)),
      el('div', { class: 'main' }, el('h3', { class: 'rowtitle', title: g.title, text: g.title }), meta),
      priceBlock(g),
      el('div', { class: 'act' }, el('button', {
        class: 'morebtn', type: 'button', 'aria-expanded': String(isOpen), 'aria-label': (isOpen ? 'Masquer' : 'Voir') + ' le détail de ' + g.title,
        onclick: () => { if (isOpen) S.open.delete(g.id); else S.open.add(g.id); renderList(); },
        text: isOpen ? 'Masquer' : count ? 'Offres ' + count : 'Détail',
      })));
    if (isOpen) {
      const detail = el('div', { class: 'detail' }, (g.results || []).filter((r) => inScope(r.platform)).map((r) => platformBlock(g, r)));
      if (g.notes) detail.append(el('p', { class: 'note', text: g.notes }));
      li.append(detail);
    }
    return li;
  }

  function renderList() {
    const ul = $('list'), empty = $('empty');
    ul.replaceChildren();
    empty.replaceChildren();
    const q = fold(S.q.trim());
    const rows = games().filter((g) => !q || fold(g.title).includes(q)).sort(sorter());
    if (rows.length) {
      rows.forEach((g) => ul.append(row(g)));
      ul.hidden = false;
      empty.hidden = true;
      return;
    }
    ul.hidden = true;
    empty.hidden = false;
    if (!S.data && !S.failed) empty.append(el('h2', { text: 'Chargement…' }));
    else if (S.failed) empty.append(el('h2', { text: 'Prix indisponibles' }), el('p', { text: 'La page n’a pas pu lire le fichier des prix.' }));
    else if (!S.data.generatedAt) empty.append(el('h2', { text: 'Aucun relevé pour l’instant' }),
      el('p', { text: 'Ajoute tes jeux dans wishlist.json, puis lance « Prix wishlist » depuis l’onglet Actions du dépôt. Les prix apparaissent ici une minute plus tard.' }));
    else if (!games().length) empty.append(el('h2', { text: 'Ta wishlist est vide' }), el('p', { text: 'Ajoute un jeu dans wishlist.json : il sera relevé au prochain passage.' }));
    else empty.append(el('h2', { text: 'Aucun jeu ne correspond' }), el('p', { text: 'Aucun titre ne contient « ' + S.q.trim() + ' ».' }));
  }

  function renderAll() {
    renderHeader();
    renderBanner();
    renderScope();
    renderDeals();
    renderStats();
    renderList();
  }

  $('q').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
  $('sort').value = S.sort;
  $('sort').addEventListener('change', (e) => { S.sort = e.target.value; savePrefs(); renderList(); });
  $('keys').checked = S.keys;
  $('keys').addEventListener('change', (e) => { S.keys = e.target.checked; savePrefs(); renderAll(); });

  renderAll();
  fetch('data/prices.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((d) => { S.data = d && Array.isArray(d.games) ? d : { generatedAt: null, games: [] }; })
    .catch(() => { S.failed = true; })
    .finally(renderAll);
})();
</script>
</body>
</html>
