name: Prix wishlist

on:
  schedule:
    # Tous les jours à 6h41 UTC (8h41 à Paris en été, 7h41 en hiver).
    - cron: '41 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wishlist.json
      - docs/index.html
      - src/**

permissions:
  contents: write   # enregistrer docs/data/prices.json
  pages: write      # publier la page
  id-token: write   # requis par deploy-pages

concurrency:
  group: prix-wishlist
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Aucune dépendance à installer : le script n'utilise que Node.js.
      - name: Relever les prix
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm start

      - name: Enregistrer les prix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          if git diff --cached --quiet; then
            echo "Aucun changement de prix."
          else
            git commit -m "Prix du $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
